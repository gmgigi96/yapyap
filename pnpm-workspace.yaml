packages:
  - apps/*
  - docs
  - scripts

# Dependency install scripts are denied unless listed here with a justification
# in the PR that adds them.
allowBuilds:
  # VitePress pulls in esbuild, whose binary arrives as an optional platform
  # package; its postinstall only re-verifies it, so the script stays denied.
  esbuild: false
  # Only needed for Squirrel.Windows, which YapYap does not build (NSIS instead).
  electron-winstaller: false

overrides:
  # VitePress 1.6.4 (latest stable) still pins Vite 5, which has unpatched
  # advisories; Vite 6.4.5 is the patched line its Vue extension supports.
  # Remove once a stable VitePress release depends on a patched Vite itself.
  vitepress>vite: 6.4.5
  # Stryker's REST client pulls in a qs release with denial-of-service advisories.
  # Remove once typed-rest-client (through @stryker-mutator/core) pins qs 6.16.0
  # or later.
  qs@<6.16.0: 6.16.1
  # electron-builder's Electron downloader still uses global-agent 3, whose
  # logger depends on sprintf-js, which has an unpatched denial-of-service
  # advisory. global-agent 4 keeps the same bootstrap() API without it.
  # Remove once @electron/get (through electron-builder) depends on
  # global-agent 4 or later.
  global-agent@3: 4.1.3
  # minimatch has a denial-of-service advisory fixed only in 11.0.1
  # (GHSA-g3hv-75wg-m249), and electron-builder still pulls in majors 3, 5
  # and 9 through packages whose newer releases use the modern API. asar 4
  # and universal 3 are what electron-builder loads with import(); filelist 2
  # keeps jake's FileList; minimatch 11 keeps 10's exports. Remove each once
  # electron-builder and ejs depend on these versions themselves.
  app-builder-lib>@electron/asar: 4.3.1
  app-builder-lib>@electron/universal: 3.0.6
  # asar 4's glob 13 has its own advisory (GHSA-3g3m-2fjr-6pw4), fixed in 14.
  '@electron/asar>glob': 14.0.3
  filelist@1: 2.0.2
  minimatch@<11.0.1: 11.0.4
  # YapYap builds no Squirrel.Windows installer (NSIS instead), and this
  # optional peer of electron-builder only brings an old glob and rimraf.
  electron-builder-squirrel-windows: '-'
