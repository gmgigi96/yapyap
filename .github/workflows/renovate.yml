name: Renovate

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    name: Update pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Renovate works through the automation App's own token, so the workflow
    # token only reads.
    permissions:
      contents: read
    steps:
      # A short-lived token from the YapYap automation GitHub App, so bot PRs
      # trigger CI (the workflow token's PRs never do; see CONTRIBUTING).
      - name: Mint the automation token
        id: app-token
        if: vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: yapyap
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-statuses: write
          permission-checks: read
      - name: Say why nothing is proposed
        if: steps.app-token.outputs.token == ''
        run: echo "::notice::The automation App is not configured, so no updates are proposed (see CONTRIBUTING)."
      - name: Run Renovate
        if: steps.app-token.outputs.token != ''
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.206.2
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # Commits made through GitHub's API are signed by GitHub, as the
          # master ruleset requires.
          RENOVATE_PLATFORM_COMMIT: enabled
