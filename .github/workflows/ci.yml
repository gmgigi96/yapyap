name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      packaging: ${{ steps.scope.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Pull requests skip what their changes cannot affect (ADR 0007); every
      # other event has no base, so it runs everything.
      - name: Decide what this change must check
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/src/bin/ci-changes.ts

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Renovate reports a broken config only once it runs on master; this
      # catches it here, with the same Renovate the workflow runs.
      - name: Validate .github/renovate.json
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/renovatebot/renovate:44.206.2
          renovate-config-validator --strict --no-global .github/renovate.json

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Keep the coverage report for SonarQube Cloud
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube Cloud
    needs: [changes, test]
    # Every pull request is analyzed, even one that changes no code, because
    # the ruleset requires SonarQube Cloud's own check on each of them.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      # Pull requests from forks get no secrets: sonar-fork.yml analyzes them
      # once this run ends, and their merge waits for that analysis's check.
      - name: Leave forks to their own analysis
        id: fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "fork=true" >> "$GITHUB_OUTPUT"
          echo "::notice::This pull request comes from a fork: the SonarQube Cloud for forks workflow analyzes it after this run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fork.outputs.fork != 'true'
        with:
          # Full history, so new code and blame are attributed correctly.
          fetch-depth: 0
          persist-credentials: false
      # The analyzer resolves types through node_modules.
      - uses: ./.github/actions/setup
        if: steps.fork.outputs.fork != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.fork.outputs.fork != 'true' && needs.test.result == 'success'
        with:
          name: coverage
          path: coverage
      # A run that cannot analyze must not pass as if it had.
      - name: Check for the analysis token
        if: steps.fork.outputs.fork != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing, so SonarQube Cloud cannot analyze this change (see CONTRIBUTING)."
            exit 1
          fi
      - name: Analyze and wait for the quality gate
        if: steps.fork.outputs.fork != 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  e2e:
    name: E2E (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        # Ubuntu restricts unprivileged user namespaces, and a development
        # Electron has no setuid sandbox helper, so Chromium's sandbox (which
        # E2E tests keep on) would abort a directly spawned second instance.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm test:e2e
      - name: E2E (Linux, Wayland)
        if: runner.os == 'Linux'
        # The display check again, on a headless Weston, so the Wayland
        # backend is tested on a real compositor too (#41). The build from the
        # previous step is reused.
        run: |
          sudo apt-get install -y --no-install-recommends weston
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          weston --backend=headless --renderer=pixman --socket=wayland-yapyap --idle-time=0 &
          for _ in $(seq 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-yapyap" ] && break
            sleep 0.2
          done
          cd apps/desktop
          YAPYAP_E2E_WAYLAND_DISPLAY=wayland-yapyap xvfb-run -a pnpm exec playwright test --project=e2e e2e/display.spec.ts
      - name: E2E
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          # test-results holds the screenshots a new or changed visual baseline needs.
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7

  mutation:
    name: Mutation
    needs: changes
    # A pull request mutates its changes before they merge; master has nothing new to prove.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/mutation.yml

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.packaging != 'none'
    uses: ./.github/workflows/package.yml
    with:
      scope: ${{ needs.changes.outputs.packaging }}

  smoke:
    name: Smoke
    needs: [changes, package]
    if: needs.changes.outputs.packaging != 'none'
    uses: ./.github/workflows/smoke.yml
    with:
      scope: ${{ needs.changes.outputs.packaging }}

  # A stable release needs a beta that testers have had for a few days
  # (#184); the release PR cannot merge before then.
  beta-gate:
    name: Beta gate
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check a beta of this version is published
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/bin/check-beta-gate.ts

  repository:
    name: Package repositories
    needs: changes
    # The apt and dnf repositories (#344) follow the packaging they serve.
    if: needs.changes.outputs.packaging != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install, update and switch channels on Debian, Ubuntu and Fedora
        run: bash packaging/repository/test.sh

  distribution:
    name: Homebrew, winget and Scoop manifests
    needs: changes
    # The casks and manifests (#345, #346) follow the packaging and release
    # scripts that write them.
    if: needs.changes.outputs.packaging == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check them against their schemas, and the casks with brew style and audit
        run: bash packaging/distribution/test.sh

  # The one required check for this workflow: jobs may skip what a change
  # cannot affect, but none may fail or be cancelled.
  result:
    name: CI result
    needs:
      - changes
      - lint
      - renovate
      - test
      - sonar
      - e2e
      - mutation
      - package
      - smoke
      - beta-gate
      - repository
      - distribution
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
