name: Package repositories

# Rebuilds and deploys the apt, dnf and pacman repositories at
# packages.guita.org (#344, #350) once a release's or beta's packages are on
# GitHub. The site holds only the signed indexes and signatures; every
# package download is redirected to GitHub Releases.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-repositories
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy package repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: ${{ github.workspace }}/site
      GH_TOKEN: ${{ github.token }}
      HAS_KEY: ${{ secrets.PACKAGES_SIGNING_KEY != '' }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Check the signing key and deploy token exist
        id: ready
        run: |
          if [[ $HAS_KEY != true || $HAS_TOKEN != true ]]; then
            echo "::notice::PACKAGES_SIGNING_KEY or CLOUDFLARE_API_TOKEN is missing, so the package repositories were not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan the channels from the published releases
        if: steps.ready.outputs.ready == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp | jq 'add' > "$RUNNER_TEMP/releases.json"
          node scripts/src/bin/package-repository.ts "$SITE" < "$RUNNER_TEMP/releases.json"
      - name: Download the planned packages
        if: steps.ready.outputs.ready == 'true'
        run: |
          while read -r tag file; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$SITE/pool/$tag"
          done < "$SITE/.plan/files"
      - name: Build and sign the indexes
        if: steps.ready.outputs.ready == 'true'
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          gnupg=$(mktemp -d)
          chmod 700 "$gnupg"
          docker run --rm -i -v "$gnupg:/gnupg" -e GNUPGHOME=/gnupg docker.io/library/debian:13 bash -c '
            apt-get update -qq && apt-get install -qq -y gpg >/dev/null && gpg --batch --import' <<< "$PACKAGES_SIGNING_KEY"
          bash packaging/repository/build-site.sh "$SITE" "$gnupg"
          sudo rm -rf "$gnupg"
      - name: Keep only the indexes, which redirect to the packages on GitHub
        if: steps.ready.outputs.ready == 'true'
        run: |
          sudo chown -R "$USER" "$SITE"
          rm -rf "$SITE/.plan" "$SITE/pool" "$SITE"/rpm/*/pool "$SITE"/arch/*/x86_64/*.pkg.tar.zst
          cp packaging/repository/index.html "$SITE/index.html"
          find "$SITE" -type f | sort
      - name: Deploy to Cloudflare Pages
        if: steps.ready.outputs.ready == 'true'
        # From its own lockfile, outside the pnpm workspace, so every package is
        # pinned by its hash, and without install scripts, which a Pages upload
        # does not need.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tools=packaging/repository/deploy
          npm ci --prefix "$tools" --ignore-scripts --no-audit --no-fund
          "$tools/node_modules/.bin/wrangler" pages deploy "$SITE" \
            --project-name yapyap-packages --branch main --commit-dirty=true
      - name: Check apt, dnf and pacman find YapYap there, without downloading it
        if: steps.ready.outputs.ready == 'true'
        run: |
          sleep 30
          docker run --rm docker.io/library/debian:13 bash -c '
            set -e
            apt-get update -qq && apt-get install -qq -y ca-certificates curl >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://packages.guita.org/yapyap.gpg -o /etc/apt/keyrings/yapyap.gpg
            curl -fsSL https://packages.guita.org/yapyap-beta.sources -o /etc/apt/sources.list.d/yapyap.sources
            apt-get update -qq
            apt-cache policy yapyap | grep -q "Candidate: [0-9]"
            file=$(apt-cache show yapyap | awk "/^Filename:/ { print \$2; exit }")
            curl -sI "https://packages.guita.org/$file" | grep -qi "^location: https://github.com/vascoguita/yapyap/releases/download/"'
          docker run --rm docker.io/library/fedora:44 bash -c '
            set -e
            curl -fsSL https://packages.guita.org/yapyap-beta.repo -o /etc/yum.repos.d/yapyap-beta.repo
            dnf -q -y makecache
            dnf -q info YapYap >/dev/null'
          docker run --rm docker.io/library/archlinux:base-devel@sha256:0ccc8b2e55c0c26a6e501e892cc6b1cdea7cfdf77e432941320148b4dabd2bff bash -c '
            set -e
            pacman-key --init >/dev/null 2>&1
            curl -fsSL https://packages.guita.org/yapyap.asc -o /tmp/yapyap.asc
            pacman-key --add /tmp/yapyap.asc >/dev/null 2>&1
            pacman-key --lsign-key "$(gpg --with-colons --show-keys /tmp/yapyap.asc | awk -F: "/^fpr/ { print \$10; exit }")" >/dev/null 2>&1
            curl -fsSL https://packages.guita.org/yapyap-beta.pacman.conf >> /etc/pacman.conf
            pacman -Sy --noconfirm >/dev/null
            # -dd: the package alone, without the files of its dependencies.
            file=$(pacman -Sddp --print-format "%f" yapyap-bin)
            curl -sI "https://packages.guita.org/arch/beta/x86_64/$file" | grep -qi "^location: https://github.com/vascoguita/yapyap/releases/download/"'
